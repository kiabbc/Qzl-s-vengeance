<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenge of QZL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 pb-20">

    <div id="app" class="max-w-md mx-auto space-y-4">
        <!-- هدر و UI اصلی خودتان -->
        <div class="flex justify-between items-center p-4 bg-slate-800 rounded-xl border border-slate-700">
            <h1 class="text-xl font-bold text-indigo-400">Revenge of QZL</h1>
            <div id="user-status" class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">
                در حال بارگذاری...
            </div>
        </div>

        <div id="main-container" class="space-y-4">
            <!-- محتوای اصلی به صورت پویا رندر می‌شود -->
        </div>
    </div>
    <script>
        let db = null;
        const DB_NAME = 'QZL_DB';
        const DB_VERSION = 1;

        const request = indexedDB.open(DB_NAME, DB_VERSION);
        
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains('proofs')) {
                db.createObjectStore('proofs', { keyPath: 'id' });
            }
        };

        request.onsuccess = (e) => {
            db = e.target.result;
            renderView();
        };

        function getData() {
            return JSON.parse(localStorage.getItem('qzl_data') || '{"topics":[]}');
        }

        function saveData(data) {
            localStorage.setItem('qzl_data', JSON.stringify(data));
        }

        // ۱. اصلاح باگ پیدا کردن تسک بر اساس sub.id به جای عنوان متنی
        function findNextAvailable(callback) {
            if (!db) return callback(null);
            
            const transaction = db.transaction(['proofs'], 'readonly');
            const store = transaction.objectStore('proofs');
            const requestAll = store.getAll();

            requestAll.onsuccess = (e) => {
                const proofs = e.target.result || [];
                const completedSubIds = proofs.map(p => p.subId);

                const data = getData();
                for (let t of (data.topics || [])) {
                    for (let sub of (t.subs || [])) {
                        if (!completedSubIds.includes(sub.id)) {
                            return callback({ topic: t, sub: sub });
                        }
                    }
                }
                callback(null);
            };
        }

        function getAllSubsInOrder() {
            const data = getData();
            const list = [];
            data.forEach((topic, ti) => {
                (topic.subs || []).forEach((sub, si) => {
                    list.push({ ti, si, topicTitle: topic.title, sub });
                });
            });
            return list;
        }

        // ۲. اصلاح باگ کسر امتیاز در delProof / rejectProof
        function delProof(id) {
            if (!db) return;
            const transaction = db.transaction(['proofs'], 'readwrite');
            const store = transaction.objectStore('proofs');
            
            const getReq = store.get(id);
            getReq.onsuccess = (e) => {
                const proof = e.target.result;
                if (proof && proof.status === 'approved') {
                    let totalPoints = parseInt(localStorage.getItem('qzl_points') || '0', 10);
                    totalPoints = Math.max(0, totalPoints - (proof.score || 0));
                    localStorage.setItem('qzl_points', totalPoints);
                }
                store.delete(id);
            };

            transaction.oncomplete = () => {
                renderView();
            };
        }

        // ۳. آزادسازی حافظه رسانه‌ها جهت جلوگیری از Memory Leak
        let activeMediaUrls = [];
        function safeCreateObjectURL(blob) {
            const url = URL.createObjectURL(blob);
            activeMediaUrls.push(url);
            return url;
        }

        function cleanupMedia() {
            activeMediaUrls.forEach(url => URL.revokeObjectURL(url));
            activeMediaUrls = [];
        }

        function loadCurrentMedia(subId) {
            if (!db) return;
            const transaction = db.transaction(['proofs'], 'readonly');
            const store = transaction.objectStore('proofs');
            const requestAll = store.getAll();

            requestAll.onsuccess = (e) => {
                const proofs = e.target.result || [];
                const mediaDiv = document.getElementById('currentMedia');
                if (!mediaDiv) return;

                const currentProof = proofs.find(p => p.subId === subId);
                if (currentProof && currentProof.blob) {
                    cleanupMedia();
                    const url = safeCreateObjectURL(currentProof.blob);
                    mediaDiv.innerHTML = `<img src="${url}" class="w-full rounded-lg my-2 border border-slate-600" />`;
                } else {
                    mediaDiv.innerHTML = `<p class="text-xs text-slate-500">تصویری ثبت نشده است.</p>`;
                }
            };
        }

        function renderView() {
            const container = document.getElementById('main-container');
            if (!container) return;

            findNextAvailable((result) => {
                if (!result) {
                    container.innerHTML = `
                        <div class="p-6 bg-slate-800 rounded-xl border border-slate-700 text-center">
                            <h2 class="text-emerald-400 font-bold text-lg">تمام تسک‌ها تکمیل شده‌اند!</h2>
                        </div>`;
                    return;
                }

                container.innerHTML = `
                    <div class="p-5 bg-slate-800 rounded-xl border border-slate-700 space-y-4">
                        <h2 class="text-indigo-300 font-bold text-lg">${result.topic.title} - ${result.sub.title}</h2>
                        
                        <div id="currentMedia" class="min-h-[50px] flex items-center justify-center bg-slate-900/50 rounded-lg p-2">
                            <!-- نمایش رسانه -->
                        </div>

                        <div class="space-y-2">
                            <label class="text-xs text-slate-400 block">ثبت توضیحات یا اثبات:</label>
                            <textarea id="extra-text" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100" rows="3" placeholder="توضیحات خود را بنویسید..."></textarea>
                            
                            <input type="file" id="mediaFile" accept="image/*" class="hidden" />
                            
                            <div class="flex gap-2">
                                <button id="upload-btn" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium">آپلود تصویر</button>
                                <button id="save-sub-btn" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-medium">ثبت نهایی</button>
                            </div>
                        </div>
                    </div>`;

                // اتصال ایمن رویدادها بدون onclick اینلاین
                document.getElementById('upload-btn').addEventListener('click', () => {
                    document.getElementById('mediaFile').click();
                });

                document.getElementById('save-sub-btn').addEventListener('click', () => {
                    saveSubAction(result.sub.id, result.sub.title);
                });

                loadCurrentMedia(result.sub.id);
            });
        }

        function saveSubAction(subId, subTitle) {
            if (!db) return;
            const extraText = document.getElementById('extra-text').value;
            const fileInput = document.getElementById('mediaFile');
            const file = fileInput.files[0];

            const transaction = db.transaction(['proofs'], 'readwrite');
            const store = transaction.objectStore('proofs');

            const proofData = {
                id: 'proof_' + Date.now(),
                subId: subId,
                title: subTitle,
                text: extraText,
                blob: file || null,
                status: 'pending',
                timestamp: Date.now()
            };

            store.add(proofData);

            transaction.oncomplete = () => {
                alert('اطلاعات با موفقیت ثبت شد.');
                renderView();
            };
        }
    </script>
</body>
</html>
