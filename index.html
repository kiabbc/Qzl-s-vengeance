<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenge of QZL</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {

  margin: 0;
  padding: 16px;
}
.neon-card-pink {
  background: #0a0a0a;
  border: 2px solid #ff007f;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
}
.neon-card-blue {
  background: #0a0a0a;
  border: 2px solid #00d2ff;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
}
.neon-card-purple {
  background: #0a0a0a;
  border: 2px solid #a855f7;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;

}
.btn-pink {
  background: #0a0a0a;
  color: #ff007f;
  border: 2px solid #ff007f;
  padding: 14px;
  border-radius: 14px;
  width: 100%;
  font-weight: bold;
  margin-top: 12px;
  box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
  text-align: center;
  cursor: pointer;
}
.btn-blue {
  background: #0a0a0a;
  color: #00d2ff;
  border: 2px solid #00d2ff;
  padding: 14px;
  border-radius: 14px;
  width: 100%;
  font-weight: bold;
  margin-top: 12px;
  box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
  text-align: center;
  cursor: pointer;
}
.btn-purple {
  background: #0a0a0a;
  color: #a855f7;
  border: 2px solid #a855f7;
  padding: 14px;
  border-radius: 14px;
  width: 100%;
  font-weight: bold;
  margin-top: 12px;
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
  text-align: center;
  cursor: pointer;
}
.btn2 { background: #1f2937; color: white; padding: 12px; border-radius: 10px; width: 100%; font-size: 14px; border: 1px solid #4b5563; cursor: pointer; margin-top: 8px; }
.btn-green { background: #166534; color: white; padding: 10px; border-radius: 10px; font-size: 13px; cursor: pointer; width: 100%; text-align: center; font-weight: bold; margin-top: 8px;}
.btn-started { background: #4b5563 !important; color: #d1d5db !important; border-color: #6b7280 !important; cursor: not-allowed; }
.btn-red { background: #7f1d1d; color: white; padding: 10px; border-radius: 10px; font-size: 13px; cursor: pointer; width: 100%; text-align: center; font-weight: bold; margin-top: 8px;}
.btn-sm { padding: 6px 12px; border-radius: 6px; font-size: 12px; margin-left: 6px; cursor: pointer; }
input, textarea, select { width: 100%; padding: 12px; border-radius: 8px; background: #111; border: 1px solid #ff007f; color: white; margin-bottom: 14px; margin-top: 6px; }
.progress-bg { background: #111; border-radius: 10px; height: 16px; overflow: hidden; border: 1px solid #444; margin-top: 6px; }
.progress-fill { background: #ff007f; height: 100%; border-radius: 10px; transition: width 0.4s; box-shadow: 0 0 8px #ff007f; }
.led-online { display: inline-block; width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; margin-left: 6px; box-shadow: 0 0 8px #22c55e; }
.led-offline { display: inline-block; width: 10px; height: 10px; background-color: #ef4444; border-radius: 50%; margin-left: 6px; }
.hidden { display: none; }

</style>
</head>
<body>

<div id="login" class="max-w-md mx-auto mt-12">
  <div class="text-center mb-6">
    <div class="text-3xl mb-2">👅</div>
  </div>
  <div class="neon-card-pink text-center">
    <h1 class="text-2xl text-pink-500 font-bold mb-4">Revenge of QZL</h1>
    <button onclick="go('ghazal')" class="btn-pink">QZL 👑</button>
    <button onclick="go('mohammad')" class="btn-blue">MJ 👑</button>
    <button onclick="go('kiarash')" class="btn-purple">KIA 🍑</button>
  </div>
</div>

<div id="pass" class="hidden max-w-md mx-auto mt-16">
  <div class="neon-card-pink text-center">
    <h2 class="text-xl text-pink-500 mb-4">رمز غزال</h2>
    <input id="pw" type="password" placeholder="رمز عبور">
    <p id="err" class="text-red-500 text-sm hidden mb-2">رمز اشتباه است</p>
    <button onclick="check()" class="btn-pink">ورود</button>
    <button onclick="back()" class="btn2 mt-2">بازگشت</button>
  </div>
</div>

<div id="dash" class="hidden max-w-md mx-auto">
  <div class="flex justify-between items-center mb-4">
    <div class="flex items-center">
      <h2 id="title" class="text-xl font-bold"></h2>
      <div id="ghazalStatusContainer" class="hidden mr-3 flex items-center text-xs">
        <span id="ghazalLed" class="led-offline"></span>
        <span id="ghazalStatusText" class="text-gray-400">آفلاین</span>
      </div>
    </div>
    <button onclick="logout()" class="text-gray-400 text-sm underline cursor-pointer">خروج</button>
  </div>

  <div class="neon-card-pink mb-4" id="progressCard">
    <div class="flex justify-between text-xs mb-1 text-pink-300">
      <span id="currentPoints">۰</span>
      <span id="goalPoints">هدف: ۰</span>
    </div>
    <div class="progress-bg">
      <div id="progressFill" class="progress-fill" style="width:0%"></div>
    </div>
    <div class="text-xs text-gray-400 mt-2 text-center" id="remainText">امتیاز باقی‌مانده: ۰</div>
  </div>

  <div id="content"></div>
</div>

<div id="popupModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50">
  <div class="neon-card-pink max-w-sm mx-auto text-center">
    <h3 class="text-lg font-bold text-pink-500 mb-2">پیام سیستم</h3>
    <p id="popupMessage" class="text-sm text-gray-200 mb-4">غزال آنلاین شد!</p>
    <button onclick="closePopup()" class="btn-pink">متوجه شدم</button>
  </div>
</div>

<div id="extraModal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50">
  <div class="neon-card-pink max-w-md mx-auto w-full text-center max-h-[90vh] overflow-y-auto">
    <h3 class="text-xl font-bold text-pink-400 mb-3">🚨 سورپرایز Extra!</h3>
    <div id="extraModalContent" class="text-sm text-gray-200 mb-4 space-y-3 text-right"></div>
    <button onclick="openExtraProofModal()" class="btn-pink">ثبت اثبات Extra (+۵ امتیاز)</button>
  </div>
</div>

<div id="extraProofModal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50">
  <div class="neon-card-pink max-w-md mx-auto w-full text-center">
    <h3 class="text-lg font-bold text-pink-400 mb-3">ارسال اثبات Extra</h3>
    <input type="file" id="extraFile" accept="image/*,video/*,audio/*" class="mb-3">
    <button onclick="submitExtraProof()" class="btn-pink">ارسال نهایی اثبات Extra</button>
    <button onclick="closeExtraProofModal()" class="btn2 mt-2">انصراف</button>
  </div>
</div>

<script>
const PASS = "2550958Bbc";
let db;
let statusCheckInterval = null;
let currentActiveExtra = null;
let extraTimerInstance = null;

const request = indexedDB.open('QzlDatabase', 5);
request.onerror = (e) => {
  console.error("خطا در IndexedDB:", e.target.error);
};

request.onsuccess = (e) => { 
  db = e.target.result; 
  db.onversionchange = () => { db.close(); };
  initApp(); 
};

request.onupgradeneeded = (e) => {
  const dbInstance = e.target.result;
  if (!dbInstance.objectStoreNames.contains('proofs')) {
    dbInstance.createObjectStore('proofs', { keyPath: 'id', autoIncrement: true });
  }
  if (!dbInstance.objectStoreNames.contains('media')) {
    dbInstance.createObjectStore('media', { keyPath: 'id', autoIncrement: true });
  }
};

function initApp(){
  const r = localStorage.getItem('role');
  if(r === 'ghazal'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('pass').classList.remove('hidden');
  } else if(r && r !== 'guest'){
    show(r);
  }
}

function go(role){
  if(role === 'ghazal'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('pass').classList.remove('hidden');
    document.getElementById('pw').value = '';
    document.getElementById('err').classList.add('hidden');
  } else {
    localStorage.setItem('role', role);
    const loginKey = 'login_time_' + role;
    if(!localStorage.getItem(loginKey)){
      localStorage.setItem(loginKey, Date.now());
    }
    show(role);
  }
}

function check(){
  if(document.getElementById('pw').value === PASS){
    localStorage.setItem('role', 'ghazal');
    localStorage.setItem('ghazal_last_active', Date.now());
    document.getElementById('pass').classList.add('hidden');
    show('ghazal');
  } else {
    document.getElementById('err').classList.remove('hidden');
  }
}

function back(){
  document.getElementById('pass').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
}

function logout(){
  const r = localStorage.getItem('role');
  if(r){
    localStorage.removeItem('login_time_' + r);
    localStorage.removeItem('popup_shown_' + r);
  }
  localStorage.setItem('role', 'guest');
  if(statusCheckInterval) clearInterval(statusCheckInterval);
  if(extraTimerInstance) clearTimeout(extraTimerInstance);
  document.getElementById('dash').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('popupModal').classList.add('hidden');
}

function getData(){ return JSON.parse(localStorage.getItem('topics') || '[]'); }
function saveData(data){ localStorage.setItem('topics', JSON.stringify(data)); }
function getGoal(){ return parseInt(localStorage.getItem('goalScore') || '0'); }
function saveGoal(val){ localStorage.setItem('goalScore', val); }
function getTotalPoints(){ return parseInt(localStorage.getItem('totalPoints') || '0'); }
function saveTotalPoints(val){ localStorage.setItem('totalPoints', val); }
function isGameFinished(){ return localStorage.getItem('gameFinished') === 'true'; }
function setGameFinished(val){ localStorage.setItem('gameFinished', val ? 'true' : 'false'); }
function getOnlineDelay(){ return parseInt(localStorage.getItem('ghazal_online_delay') || '2'); }

function updateProgress(){
  const total = getTotalPoints();
  const goal = getGoal();
  const percent = goal > 0 ? Math.min(100, (total / goal) * 100) : 0;
  document.getElementById('currentPoints').innerText = total;
  document.getElementById('goalPoints').innerText = 'هدف: ' + goal;
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('remainText').innerText = 'امتیاز باقی‌مانده: ' + Math.max(0, goal - total);
}

function show(role){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('pass').classList.add('hidden');
  document.getElementById('dash').classList.remove('hidden');
  
  const titleEl = document.getElementById('title');
  if(role === 'ghazal'){
    titleEl.innerText = 'داشبورد QZL 👑';
    titleEl.className = 'text-xl font-bold text-pink-500';
  } else if(role === 'mohammad'){
    titleEl.innerText = 'داشبورد MJ 👑';
    titleEl.className = 'text-xl font-bold text-blue-400';
  } else {
    titleEl.innerText = 'داشبورد KIA 🍑';
    titleEl.className = 'text-xl font-bold text-purple-400';
  }
  
  updateProgress();
  setupGhazalStatusIndicator(role);

  if(role === 'ghazal') renderGhazalMenu();
  else renderView(role);
}

function setupGhazalStatusIndicator(role){
  const container = document.getElementById('ghazalStatusContainer');
  if(role === 'mohammad' || role === 'kiarash'){
    container.classList.remove('hidden');
    checkGhazalOnlineStatus(role);
    if(statusCheckInterval) clearInterval(statusCheckInterval);
    statusCheckInterval = setInterval(() => checkGhazalOnlineStatus(role), 5000);
  } else {
    container.classList.add('hidden');
    if(statusCheckInterval) clearInterval(statusCheckInterval);
  }
}

function checkGhazalOnlineStatus(role){
  const lastActive = parseInt(localStorage.getItem('ghazal_last_active') || Date.now());
  const delayMinutes = getOnlineDelay();
  const delayMs = delayMinutes * 60 * 1000;
  const elapsed = Date.now() - lastActive;

  const led = document.getElementById('ghazalLed');
  const text = document.getElementById('ghazalStatusText');

  if(elapsed <= delayMs || localStorage.getItem('role') === 'ghazal'){
    led.className = 'led-online';
    text.innerText = 'آنلاین';

    const popupShownKey = 'popup_shown_' + role;
    if(!localStorage.getItem(popupShownKey) && role !== 'ghazal'){
      localStorage.setItem(popupShownKey, 'true');
      showPopup('غزال آنلاین شد!');
    }
  } else {
    led.className = 'led-offline';
    text.innerText = 'آفلاین';
  }
}

function showPopup(msg){
  document.getElementById('popupMessage').innerText = msg;
  document.getElementById('popupModal').classList.remove('hidden');
}

function closePopup(){
  document.getElementById('popupModal').classList.add('hidden');
}

function renderGhazalMenu(){
  document.getElementById('progressCard').style.display = 'block';
  updateProgress();
  
  let html = `
    <div class="neon-card-pink text-center cursor-pointer section-space" onclick="renderGhazalTopics()">
      <h3 class="text-pink-400 font-bold text-lg">Create & Edit Topics</h3>
      <p class="text-xs text-gray-400 mt-2">مدیریت و ساخت تاپیک‌ها، امتیازات و تصاویر پوزیشن‌ها</p>
    </div>
    <div class="neon-card-pink text-center cursor-pointer section-space" onclick="renderGhazalSubtopics()">
      <h3 class="text-pink-400 font-bold text-lg">Create & Edit Subtopics</h3>
      <p class="text-xs text-gray-400 mt-2">مدیریت تسک‌ها، پوزیشن‌ها، تحقیرها، آپلود فایل‌ها و Extra</p>
    </div>
    <div class="neon-card-pink text-center cursor-pointer section-space" onclick="renderGhazalSettings()">
      <h3 class="text-pink-400 font-bold text-lg">Settings & Proofs</h3>
      <p class="text-xs text-gray-400 mt-2">بررسی اثبات‌ها، تنظیمات هدف و پشتیبان‌گیری کامل JSON</p>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}

function renderGhazalTopics(){
  const data = getData();
  let html = `
    <button onclick="renderGhazalMenu()" class="btn2 mb-4">← بازگشت به منوی اصلی غزال</button>
    <div class="neon-card-pink section-space">
      <h3 class="text-pink-400 font-bold mb-3">ساخت تاپیک جدید</h3>
      <input id="newTopic" placeholder="اسم تاپیک">
      <label class="text-sm text-gray-400">امتیاز تاپیک</label>
      <select id="newScore">
        <option value="5">۵</option>
        <option value="10">۱۰</option>
        <option value="15">۱۵</option>
        <option value="20">۲۰</option>
        <option value="25">۲۵</option>
        <option value="30">۳۰</option>
      </select>

      <label class="text-sm text-pink-300 mt-2 block">آپلود عکس/گیف پوزیشن کیارش برای تاپیک:</label>
      <input type="file" id="newTopicKImg" accept="image/*">

      <label class="text-sm text-pink-300 mt-2 block">آپلود عکس/گیف پوزیشن محمد برای تاپیک:</label>
      <input type="file" id="newTopicMImg" accept="image/*">

      <button onclick="addTopic()" class="btn-pink">اضافه کردن تاپیک</button>
    </div>
    <div class="neon-card-pink">
      <h3 class="text-pink-400 font-bold mb-3">لیست تاپیک‌ها</h3>
  `;
  
  if(data.length === 0){
    html += '<p class="text-gray-500 text-sm text-center">هنوز تاپیکی ساخته نشده</p>';
  } else {
    data.forEach((topic, ti) => {
      html += `
        <div class="bg-gray-900 border border-pink-900 rounded-lg p-3 mb-3 flex justify-between items-center">
          <div>
            <div class="font-bold text-sm text-pink-300 mb-1">${topic.title}</div>
            <div class="text-xs text-yellow-500">امتیاز: ${topic.score || 0} | تعداد ساب‌تاپیک‌ها: ${(topic.subs || []).length}</div>
          </div>
          <div>
            <button onclick="moveTopic(${ti},-1)" class="btn-sm bg-gray-700">↑</button>
            <button onclick="moveTopic(${ti},1)" class="btn-sm bg-gray-700">↓</button>
            <button onclick="editTopic(${ti})" class="text-blue-400 text-xs ml-2">ویرایش</button>
            <button onclick="delTopic(${ti})" class="text-red-400 text-xs">حذف</button>
          </div>
        </div>
      `;
    });
  }
  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}

function renderGhazalSubtopics(){
  const data = getData();
  let html = `
    <button onclick="renderGhazalMenu()" class="btn2 mb-4">← بازگشت به منوی اصلی غزال</button>
    <div class="neon-card-pink">
      <h3 class="text-pink-400 font-bold mb-4">مدیریت Taskها و تنظیمات ساب‌تاپیک</h3>
  `;
  
  if(data.length === 0){
    html += '<p class="text-gray-500 text-sm text-center">ابتدا یک تاپیک در بخش Topics بسازید.</p>';
  } else {
    data.forEach((topic, ti) => {
      html += `
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4 section-space">
          <div class="font-bold text-pink-400 text-base mb-3">${topic.title}</div>
          <input id="sub${ti}" placeholder="نام Task جدید">
          <button onclick="addSub(${ti})" class="btn2 mb-4">+ اضافه کردن Task به این تاپیک</button>
      `;
      (topic.subs || []).forEach((sub, si) => {
        html += `
          <div class="bg-black border border-gray-800 rounded-lg p-3 mb-3 flex justify-between items-center text-xs">
            <span class="font-medium text-pink-300">Task: ${sub.title}</span>
            <div>
              <button onclick="editSub(${ti}, ${si})" class="text-blue-400 ml-3">ویرایش جزئیات/فایل‌ها/Extra</button>
              <button onclick="delSub(${ti}, ${si})" class="text-red-400">حذف</button>
            </div>
          </div>
        `;
      });
      html += `</div>`;
    });
  }
  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}

function renderGhazalSettings(){
  const finished = isGameFinished();
  const currentDelay = getOnlineDelay();
  
  let html = `
    <button onclick="renderGhazalMenu()" class="btn2 mb-4">← بازگشت به منوی اصلی غزال</button>
    
    <div class="neon-card-pink section-space">
      <h3 class="text-pink-400 font-bold mb-3">پشتیبان‌گیری کامل اطلاعات (شامل تمام موارد جدید و Extra)</h3>
      <p class="text-xs text-gray-400 mb-3">می‌توانید از تمام تنظیمات، تاپیک‌ها، ساب‌تاپیک‌ها، فایل‌ها و بخش Extra خروجی کامل بگیرید.</p>
      <button onclick="exportDataJSON()" class="btn-pink mb-2">خروجی گرفتن از اطلاعات (Export JSON)</button>
      
      <label class="text-sm text-gray-400 mt-3 block">بارگذاری فایل پشتیبان (Import JSON):</label>
      <input type="file" id="importFile" accept=".json" class="mb-2">
      <button onclick="importDataJSON()" class="btn2">بارگذاری و جایگزینی اطلاعات</button>
    </div>

    <div class="neon-card-pink section-space">
      <h3 class="text-pink-400 font-bold mb-3">تنظیمات وضعیت آنلاین غزال</h3>
      <label class="text-sm text-gray-400">تاخیر آنلاین شدن پس از ورود محمد/کیارش (دقیقه، حداکثر ۳۰):</label>
      <input id="onlineDelayInput" type="number" min="1" max="30" value="${currentDelay}">
      <button onclick="saveOnlineDelay()" class="btn-pink">ذخیره تنظیمات آنلاین</button>
    </div>

    <div class="neon-card-pink section-space">
      <h3 class="text-pink-400 font-bold mb-3">وضعیت بازی و هدف</h3>
      <p class="text-sm mb-3">${finished ? '<span class="text-green-400">بازی به پایان رسیده</span>' : '<span class="text-yellow-400">بازی در حال انجام است</span>'}</p>
      ${finished 
        ? '<button onclick="setGameFinished(false); renderGhazalSettings();" class="btn2 mb-3">باز کردن دوباره بازی</button>'
        : '<button onclick="finishGame()" class="btn-pink mb-3">اعلام پایان بازی</button>'}
      
      <label class="text-sm text-gray-400">امتیاز هدف نهایی</label>
      <input id="goalInput" type="number" placeholder="امتیاز هدف" value="${getGoal()}">
      <button onclick="setGoal()" class="btn-pink">ذخیره هدف</button>
    </div>

    <div class="neon-card-pink">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-yellow-500 font-bold">اثبات‌های ارسال‌شده</h3>
        <button onclick="loadProofs()" class="text-xs text-blue-400 underline">بارگذاری مجدد</button>
      </div>
      <div id="proofsArea"><p class="text-gray-500 text-sm">در حال بارگذاری...</p></div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
  loadProofs();
}

function exportDataJSON(){
  const backupData = {
    topics: getData(),
    goalScore: getGoal(),
    totalPoints: getTotalPoints(),
    gameFinished: isGameFinished(),
    ghazalOnlineDelay: getOnlineDelay()
  };
  
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", "revenge_of_qzl_complete_backup.json");
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function importDataJSON(){
  const fileInput = document.getElementById('importFile');
  if(!fileInput.files || !fileInput.files[0]) {
    alert('لطفاً ابتدا یک فایل JSON انتخاب کنید.');
    return;
  }
  
  const file = fileInput.files[0];
  const reader = new FileReader();
  
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if(parsed.topics) localStorage.setItem('topics', JSON.stringify(parsed.topics));
      if(parsed.goalScore !== undefined) localStorage.setItem('goalScore', parsed.goalScore);
      if(parsed.totalPoints !== undefined) localStorage.setItem('totalPoints', parsed.totalPoints);
      if(parsed.gameFinished !== undefined) localStorage.setItem('gameFinished', parsed.gameFinished);
      if(parsed.ghazalOnlineDelay !== undefined) localStorage.setItem('ghazal_online_delay', parsed.ghazalOnlineDelay);
      
      alert('اطلاعات کامل با موفقیت ایمپورت و بارگذاری شد!');
      fileInput.value = '';
      renderGhazalSettings();
    } catch(err) {
      alert('خطا در خواندن فایل JSON. ساختار فایل معتبر نیست.');
      fileInput.value = '';
    }
  };
  
  reader.readAsText(file);
}

function saveOnlineDelay(){

  if(val > 30) val = 30;
  if(val < 1) val = 1;

function finishGame(){

function loadProofs(){
  if(!db) {
    document.getElementById('proofsArea').innerHTML = '<p class="text-red-400 text-sm">دیتابیس هنوز آماده نیست</p>';
    return;
  }
  const transaction = db.transaction(['proofs'], 'readonly');
  const store = transaction.objectStore('proofs');
  const requestAll = store.getAll();

  requestAll.onerror = function() {
    document.getElementById('proofsArea').innerHTML = '<p class="text-red-400 text-sm">خطا در خواندن اطلاعات کش‌شده</p>';
  };

  requestAll.onsuccess = function() {
    const proofs = requestAll.result || [];
    if(proofs.length === 0){
      document.getElementById('proofsArea').innerHTML = '<p class="text-gray-500 text-sm">هیچ اثباتی ثبت نشده</p>';
      return;
    }
    let html = '';
    proofs.forEach((p) => {
      const fileUrl = URL.createObjectURL(p.blob);
      const status = p.status || 'pending';
      const statusText = status === 'approved' ? '✅ تأیید شده' : status === 'rejected' ? '❌ رد شده' : '⏳ در انتظار بررسی';
      const isPunish = p.isPunishment ? ' (تنبیه)' : p.isExtra ? ' (Extra)' : '';
      const statusColor = status === 'approved' ? 'text-green-400' : status === 'rejected' ? 'text-red-400' : 'text-yellow-400';
      html += `
        <div class="bg-black border border-gray-800 rounded-lg p-3 mb-3 text-sm">
          <div class="font-medium text-pink-300 mb-1">${p.title}${isPunish}</div>
          <div class="text-xs text-gray-400 mb-2">فرستنده: ${p.by === 'mohammad' ? 'محمد' : 'کیارش'} | امتیاز: ${p.score || 0}</div>
          <div class="text-xs mb-2 ${statusColor}">${statusText}</div>
          <div class="mb-2">
            ${p.type === 'photo' ? `<img src="${fileUrl}" class="max-w-full rounded max-h-40 object-contain">` : ''}
            ${p.type === 'video' ? `<video src="${fileUrl}" controls class="w-full rounded max-h-40"></video>` : ''}
            ${p.type === 'audio' ? `<audio src="${fileUrl}" controls class="w-full"></audio>` : ''}
          </div>
          <div class="flex gap-2 mt-2">
            ${status === 'pending' ? `
              <button onclick="approveProof(${p.id},${p.score || 0})" class="btn-green flex-1">تأیید</button>
              <button onclick="rejectProof(${p.id},${p.score || 0})" class="btn-red flex-1">رد کردن</button>
            ` : ''}
            <button onclick="delProof(${p.id})" class="text-red-400 text-xs underline cursor-pointer">حذف</button>
          </div>
        </div>`;
    });
    document.getElementById('proofsArea').innerHTML = html;
  };
}

function approveProof(id, score){
  updateProofStatus(id, 'approved', score);
}

function rejectProof(id, score){
  const current = getTotalPoints();
  saveTotalPoints(Math.max(0, current - score));
  updateProgress();
  updateProofStatus(id, 'rejected', 0);
  alert('اثبات رد شد و ' + score + ' امتیاز کم گردید');
}

function updateProofStatus(id, status, scoreToAdd){
  const transaction = db.transaction(['proofs'], 'readwrite');
  const store = transaction.objectStore('proofs');
  const getReq = store.get(id);
  getReq.onsuccess = function() {
    const proof = getReq.result;
    if(proof){
      if(status === 'approved' && proof.status !== 'approved'){
        const current = getTotalPoints();
        saveTotalPoints(current + (proof.score || 0));
        updateProgress();
      }
      proof.status = status;
      store.put(proof).onsuccess = function() { loadProofs(); };
    }
  };
}

  const taskStateKey = 'task_state_' + role + '_' + ti + '_' + si;

  if(btn){
    btn.innerText = 'در حال انجام';
    btn.className = 'btn-green btn-started';
  }

  const data = getData();
  const s = data[ti].subs[si];
  if(s.extra && s.extra.enabled){
    setupExtraTimer(s, ti, si, role);
  }
}

let activeAudioElement = null;

function loadMediaForSub(subId, role){
  if(!db) return;
  const transaction = db.transaction(['media'], 'readonly');
  const store = transaction.objectStore('media');
  const requestAll = store.getAll();
  requestAll.onsuccess = function(){
    const allMedia = requestAll.result || [];
    const media = allMedia.filter(m => m.subId === subId);
    const area = document.getElementById('mediaArea');
    if(!area) return;
    if(media.length === 0){
      area.innerHTML = '<p class="text-xs text-gray-500">فایلی توسط غزال آپلود نشده</p>';
      return;
    }
    let html = '<p class="text-xs text-pink-300 mb-2">فایل‌های دستورالعمل غزال:</p>';
    let audioBlobUrl = null;

    media.forEach(m => {
      const url = URL.createObjectURL(m.blob);
      if(m.type === 'photo') html += `<img src="${url}" class="max-w-full rounded mb-2 max-h-40">`;
      else if(m.type === 'video') html += `<video src="${url}" controls class="w-full rounded mb-2 max-h-40"></video>`;
      else {
        audioBlobUrl = url;
        html += `<audio id="instructionAudio" src="${url}" controls class="w-full mb-2"></audio>`;
      }
    });
    area.innerHTML = html;

    if(audioBlobUrl){
      activeAudioElement = new Audio(audioBlobUrl);
      document.getElementById('manualAudioPlayBox').classList.remove('hidden');
      
      // پخش خودکار یک‌بار در هر ورود به صفحه
      activeAudioElement.play().catch(err => {
        console.log("مرورگر اجازه پخش خودکار بدون تعامل را نداد:", err);
      });
    } else {
      document.getElementById('manualAudioPlayBox').classList.add('hidden');
    }
  };
}

function playManualAudio(){
  if(activeAudioElement){
    activeAudioElement.currentTime = 0;
    activeAudioElement.play().catch(e => alert('خطا در پخش صوت'));
  }
}

function setupExtraTimer(s, ti, si, role){
  const extraKey = 'extra_shown_' + role + '_' + ti + '_' + si;
  if(localStorage.getItem(extraKey) === 'true') return;

  const delaySeconds = parseInt(s.extra.delay) || 30;
  if(extraTimerInstance) clearTimeout(extraTimerInstance);

  extraTimerInstance = setTimeout(() => {
    localStorage.setItem(extraKey, 'true');
    showExtraModal(s.extra, ti, si, role);
  }, delaySeconds * 1000);
}

  document.getElementById('extraModalContent').innerHTML = html;
  document.getElementById('extraModal').classList.remove('hidden');

function addTopic(){
  const title = document.getElementById('newTopic').value.trim();
  const score = parseInt(document.getElementById('newScore').value);
  if(!title) return alert('اسم تاپیک را بنویس');
  
  const kImgInput = document.getElementById('newTopicKImg');
  const mImgInput = document.getElementById('newTopicMImg');

  const data = getData();
  const newTop = {title: title, score: score, subs: [], kImg: '', mImg: ''};

  let filesToProcess = 0;
  if(kImgInput.files && kImgInput.files[0]) filesToProcess++;
  if(mImgInput.files && mImgInput.files[0]) filesToProcess++;

  if(filesToProcess === 0){
    data.push(newTop);
    saveData(data);
    renderGhazalTopics();
    return;
  }

  let processed = 0;
  if(kImgInput.files && kImgInput.files[0]){
    const reader = new FileReader();
    reader.onload = function(e){
      newTop.kImg = e.target.result;
      processed++;
      if(processed === filesToProcess){
        data.push(newTop);
        saveData(data);
        renderGhazalTopics();
      }
    };
    reader.readAsDataURL(kImgInput.files[0]);
  }

  if(mImgInput.files && mImgInput.files[0]){
    const reader = new FileReader();
    reader.onload = function(e){
      newTop.mImg = e.target.result;
      processed++;
      if(processed === filesToProcess){
        data.push(newTop);
        saveData(data);
        renderGhazalTopics();
      }
    };
    reader.readAsDataURL(mImgInput.files[0]);
  }
}

function moveTopic(ti, dir){

  const temp = data[ti];
  data[ti] = data[newIndex];
  data[newIndex] = temp;
  saveData(data);
  renderGhazalTopics();
}

function removeTopicImg(ti, target){
  const data = getData();
  if(target === 'k') data[ti].kImg = '';
  if(target === 'm') data[ti].mImg = '';
  saveData(data);
  editTopic(ti);
}

function saveTopic(ti){
  const data = getData();
  data[ti].title = document.getElementById('editTitle').value.trim();
  data[ti].score = parseInt(document.getElementById('editScore').value);

  const kFile = document.getElementById('editTopicKImg').files[0];
  const mFile = document.getElementById('editTopicMImg').files[0];

  let pending = 0;
  if(kFile) pending++;
  if(mFile) pending++;

  if(pending === 0){
    saveData(data);
    renderGhazalTopics();
    return;
  }

  let done = 0;
  if(kFile){
    const r = new FileReader();
    r.onload = function(e){
      data[ti].kImg = e.target.result;
      done++;
      if(done === pending){ saveData(data); renderGhazalTopics(); }
    };
    r.readAsDataURL(kFile);
  }
  if(mFile){
    const r = new FileReader();
    r.onload = function(e){
      data[ti].mImg = e.target.result;
      done++;
      if(done === pending){ saveData(data); renderGhazalTopics(); }
    };
    r.readAsDataURL(mFile);
  }
}

function delTopic(i){
  if(!confirm('حذف شود؟')) return;
  const data = getData();
  data.splice(i, 1);
  saveData(data);
  renderGhazalTopics();
}

function addSub(ti){
  const title = document.getElementById('sub' + ti).value.trim();
  if(!title) return alert('اسم Task را بنویس');
  const data = getData();
  if(!data[ti].subs) data[ti].subs = [];
  const subId = 'sub_' + Date.now() + '_' + Math.floor(Math.random()*1000);
  data[ti].subs.push({
    id: subId, title: title, kPos:'', mImg:'', kImg:'', mPos:'', moan:false, hum:'', p1:'', p2:'', proof:'photo',
    extra: { enabled: false, delay: 30, text: '', img: '', audio: '', video: '' }
  });
  saveData(data);
  renderGhazalSubtopics();
}

function delSub(ti, si){
  const data = getData();
  data[ti].subs.splice(si, 1);
  saveData(data);
  renderGhazalSubtopics();
}

function editSub(ti, si){
  const data = getData();
  const s = data[ti].subs[si];
  if(!s.id) s.id = 'sub_' + Date.now();
  if(!s.extra) s.extra = { enabled: false, delay: 30, text: '', img: '', audio: '', video: '' };

  document.getElementById('content').innerHTML = `
    <div class="neon-card-pink">
      <h3 class="text-pink-400 font-bold mb-3">ویرایش Task: ${s.title}</h3>
      <label class="text-sm text-gray-400">پوزیشن کیارش (متن)</label>
      <input id="kPos" value="${s.kPos || ''}">

      <label class="text-sm text-pink-300 mt-2 block">آپلود عکس/گیف پوزیشن کیارش:</label>
      ${s.kImg ? `<div class="mb-2"><img src="${s.kImg}" class="max-h-24 rounded"><button onclick="removeSubImg(${ti},${si}, 'k')" class="text-red-400 text-xs underline mt-1 block">حذف این عکس</button></div>` : ''}
      <input type="file" id="subKImg" accept="image/*">

      <label class="text-sm text-gray-400 mt-2">پوزیشن محمد (متن)</label>
      <input id="mPos" value="${s.mPos || ''}">

      <label class="text-sm text-pink-300 mt-2 block">آپلود عکس/گیف پوزیشن محمد:</label>
      ${s.mImg ? `<div class="mb-2"><img src="${s.mImg}" class="max-h-24 rounded"><button onclick="removeSubImg(${ti},${si}, 'm')" class="text-red-400 text-xs underline mt-1 block">حذف این عکس</button></div>` : ''}
      <input type="file" id="subMImg" accept="image/*">

      <label class="flex items-center gap-2 text-sm my-3">
        <input type="checkbox" id="moan" ${s.moan ? 'checked' : ''}>
        آه و ناله الزامی باشد
      </label>
      
      <label class="text-sm text-gray-400">تحقیر</label>
      <textarea id="hum" rows="2">${s.hum || ''}</textarea>
      
      <label class="text-sm text-gray-400">تنبیه ۱</label>
      <input id="p1" value="${s.p1 || ''}">
      
      <label class="text-sm text-gray-400">تنبیه ۲</label>
      <input id="p2" value="${s.p2 || ''}">
      
      <label class="text-sm text-gray-400">نوع اثبات</label>
      <select id="proof">
        <option value="photo" ${s.proof==='photo'?'selected':''}>عکس</option>
        <option value="video" ${s.proof==='video'?'selected':''}>ویدیو</option>
        <option value="audio" ${s.proof==='audio'?'selected':''}>صدا</option>
      </select>

      <label class="text-sm text-pink-300 mt-3 block font-bold">مدیریت بخش Extra</label>
      <label class="flex items-center gap-2 text-sm my-2">
        <input type="checkbox" id="extraEnabled" ${s.extra.enabled ? 'checked' : ''}>
        فعال‌سازی سورپرایز Extra برای این Task
      </label>
      <label class="text-sm text-gray-400">زمان تاخیر نمایش (ثانیه):</label>
      <input id="extraDelay" type="number" value="${s.extra.delay || 30}">
      <label class="text-sm text-gray-400">متن پیام Extra:</label>
      <textarea id="extraText" rows="2">${s.extra.text || ''}</textarea>

      <label class="text-sm text-pink-300 mt-3 block">آپلود فایل‌های دستورالعمل اصلی (چندتایی)</label>
      <input type="file" id="mediaFiles" multiple accept="image/*,video/*,audio/*">
      <button onclick="uploadMedia('${s.id}')" class="btn2 mb-3">آپلود فایل‌های دستورالعمل</button>
      <div id="currentMedia" class="mb-4"><p class="text-xs text-gray-500">در حال بارگذاری...</p></div>

      <button onclick="saveSub(${ti}, ${si})" class="btn-pink">ذخیره تغییرات کامل</button>
      <button onclick="renderGhazalSubtopics()" class="btn2 mt-2">انصراف</button>
    </div>
  `;
  loadCurrentMedia(s.id);
}

function removeSubImg(ti, si, target){
  const data = getData();
  if(target === 'k') data[ti].subs[si].kImg = '';
  if(target === 'm') data[ti].subs[si].mImg = '';
  saveData(data);
  editSub(ti, si);
}

function loadCurrentMedia(subId){
  if(!db) return;
  const transaction = db.transaction(['media'], 'readonly');
  const store = transaction.objectStore('media');
  const requestAll = store.getAll();
  requestAll.onsuccess = function(){
    const all = requestAll.result || [];
    const media = all.filter(m => m.subId === subId);
    const div = document.getElementById('currentMedia');
    if(!div) return;
    if(media.length === 0){
      div.innerHTML = '<p class="text-xs text-gray-500">هنوز فایلی آپلود نشده</p>';
      return;
    }
    let html = '<p class="text-xs text-pink-300 mb-2">فایل‌های فعلی:</p>';
    media.forEach(m => {
      const url = URL.createObjectURL(m.blob);
      html += `<div class="mb-2">`;
      if(m.type === 'photo') html += `<img src="${url}" class="max-w-full rounded max-h-28">`;
      else if(m.type === 'video') html += `<video src="${url}" controls class="w-full rounded max-h-28"></video>`;
      else html += `<audio src="${url}" controls class="w-full"></audio>`;
      html += `<button onclick="deleteMedia(${m.id}, '${subId}')" class="text-red-400 text-xs mt-1 underline cursor-pointer block">حذف این فایل</button></div>`;
    });
    div.innerHTML = html;
  };
}

function uploadMedia(subId){
  const input = document.getElementById('mediaFiles');
  if(!input.files.length) return alert('فایلی انتخاب نشده');
  const files = Array.from(input.files);
  let done = 0;
  files.forEach(file => {
    let type = 'photo';
    if(file.type.startsWith('video')) type = 'video';
    else if(file.type.startsWith('audio')) type = 'audio';

    const transaction = db.transaction(['media'], 'readwrite');
    const store = transaction.objectStore('media');
    store.add({ subId: subId, type: type, blob: file }).onsuccess = function(){
      done++;
      if(done === files.length){
        alert(files.length + ' فایل آپلود شد');
        loadCurrentMedia(subId);
        input.value = '';
      }
    };
  });
}

function deleteMedia(id, subId){
  const transaction = db.transaction(['media'], 'readwrite');
  const store = transaction.objectStore('media');
  store.delete(id).onsuccess = function(){ loadCurrentMedia(subId); };
}

function saveSub(ti, si){
  const data = getData();
  const sub = data[ti].subs[si];
  sub.kPos = document.getElementById('kPos').value.trim();
  sub.mPos = document.getElementById('mPos').value.trim();
  sub.moan = document.getElementById('moan').checked;
  sub.hum = document.getElementById('hum').value.trim();
  sub.p1 = document.getElementById('p1').value.trim();
  sub.p2 = document.getElementById('p2').value.trim();
  sub.proof = document.getElementById('proof').value;

  sub.extra.enabled = document.getElementById('extraEnabled').checked;
  sub.extra.delay = parseInt(document.getElementById('extraDelay').value) || 30;
  sub.extra.text = document.getElementById('extraText').value.trim();

  const kFile = document.getElementById('subKImg').files[0];
  const mFile = document.getElementById('subMImg').files[0];

  let pending = 0;
  if(kFile) pending++;
  if(mFile) pending++;

  if(pending === 0){
    saveData(data);
    renderGhazalSubtopics();
    return;
  }

  let done = 0;
  if(kFile){
    const r = new FileReader();
    r.onload = function(e){
      sub.kImg = e.target.result;
      done++;
      if(done === pending){ saveData(data); renderGhazalSubtopics(); }
    };
    r.readAsDataURL(kFile);
  }
  if(mFile){
    const r = new FileReader();
    r.onload = function(e){
      sub.mImg = e.target.result;
      done++;
      if(done === pending){ saveData(data); renderGhazalSubtopics(); }
    };
    r.readAsDataURL(mFile);
  }
}

function openProof(ti, si, role){
  const data = getData();
  const s = data[ti].subs[si];
  const topicScore = data[ti].score || 0;
  const accept = s.proof === 'photo' ? 'image/*' : s.proof === 'video' ? 'video/*' : 'audio/*';
  const cardClass = role === 'mohammad' ? 'neon-card-blue' : 'neon-card-purple';
  const btnClass = role === 'mohammad' ? 'btn-blue' : 'btn-purple';

  document.getElementById('content').innerHTML = `
    <div class="${cardClass}">
      <h3 class="${role === 'mohammad' ? 'text-blue-400' : 'text-purple-400'} font-bold mb-2">ثبت اثبات</h3>
      <p class="text-sm mb-1 font-medium text-pink-300">Task: ${s.title}</p>
      <p class="text-xs text-yellow-500 mb-3">امتیاز این تسک: ${topicScore}</p>
      
      <div class="text-xs text-gray-300 mb-4 space-y-1">
        <div>پوزیشن کیارش: ${s.kPos || '—'}</div>
        <div>پوزیشن محمد: ${s.mPos || '—'}</div>
        <div>آه و ناله: ${s.moan ? 'الزامی' : 'نیاز نیست'}</div>
        ${s.hum ? `<div class="text-red-400">تحقیر: ${s.hum}</div>` : ''}
      </div>

      <input type="file" id="file" accept="${accept}">
      <button onclick="submitProof(${ti}, ${si}, '${role}', ${topicScore})" class="${btnClass}">ارسال اثبات</button>
      <button onclick="renderView('${role}')" class="btn2 mt-2">انصراف</button>
    </div>
  `;
}

function submitProof(ti, si, role, score){
  const fileInput = document.getElementById('file');
  if(!fileInput.files[0]) return alert('فایل انتخاب کنید');
  const file = fileInput.files[0];
  const data = getData();
  const s = data[ti].subs[si];

  const transaction = db.transaction(['proofs'], 'readwrite');
  const store = transaction.objectStore('proofs');
  
  const proofItem = {
    title: 'Task: ' + s.title, type: s.proof, blob: file, by: role, score: score, status: 'pending', time: Date.now()
  };

  store.add(proofItem).onsuccess = function() {
    alert('اثبات ثبت شد و پس از تأیید غزال ' + score + ' امتیاز اضافه خواهد شد\nتسک بعدی باز شد');
    renderView(role);
  };
}

function findNextAvailable(callback){
  if(!db){ callback(null); return; }
  const transaction = db.transaction(['proofs'], 'readonly');
  const store = transaction.objectStore('proofs');
  store.getAll().onsuccess = function(e){
    const proofs = e.target.result || [];
    const submittedTitles = proofs.map(p => p.title);
    const all = getAllSubsInOrder();
    for(let i=0; i<all.length; i++){
      if(!submittedTitles.includes('Task: ' + all[i].sub.title)){
        callback(all[i]);
        return;
      }
    }
    callback(null);
  };
}

function getAllSubsInOrder(){
  const data = getData();
  const list = [];
  data.forEach((topic, ti) => {
    (topic.subs || []).forEach((sub, si) => {
      list.push({ ti, si, topicTitle: topic.title, subTitle: sub.title, score: topic.score || 0, sub, topic });
    });
  });
  return list;
}

function delProof(id){
  const transaction = db.transaction(['proofs'], 'readwrite');
  const store = transaction.objectStore('proofs');
  store.delete(id).onsuccess = function() { loadProofs(); };
}
</script>
